# Hyprland — managed by chezmoi (Linux only).
# Desktop shell: Noctalia (Quickshell). Session launched via uwsm.
# Reference: https://wiki.hypr.land/Configuring/

# ---------------------------------------------------------------------------
# Monitors  (https://wiki.hypr.land/Configuring/Monitors/)
# ---------------------------------------------------------------------------
# Auto-detect; override per-machine in ~/.config/hypr/monitors.conf (untracked).
monitor = , preferred, auto, 1
source = ~/.config/hypr/monitors.conf

# ---------------------------------------------------------------------------
# Programs
# ---------------------------------------------------------------------------
$terminal = ghostty
$fileManager = thunar
# Noctalia surfaces, driven through Quickshell IPC (noctalia-shell v4.x).
# List endpoints at runtime with:  qs -c noctalia-shell ipc show
$menu = qs -c noctalia-shell ipc call launcher toggle

# ---------------------------------------------------------------------------
# Autostart  (uwsm scopes graphical apps under the systemd session)
# ---------------------------------------------------------------------------
exec-once = uwsm app -- qs -c noctalia-shell          # the Noctalia shell itself
exec-once = uwsm app -- hyprpolkitagent               # polkit auth popups
exec-once = uwsm app -- hypridle                      # idle -> lock/dpms/suspend
# Clipboard history feeding cliphist (queried via Noctalia's clipboard panel)
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ---------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# ---------------------------------------------------------------------------
# Look & feel
# ---------------------------------------------------------------------------
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    # Border colors are owned by Noctalia's App Theming — see the generated
    # `source = .../noctalia/noctalia-colors.conf` at the bottom of this file.
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(120f18ee)
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = windows, 1, 4, easeOutQuint
    animation = windowsOut, 1, 4, default, popin 80%
    animation = fade, 1, 4, default
    animation = workspaces, 1, 5, easeOutQuint, slide
    animation = border, 1, 6, default
}

dwindle {
    # `pseudotile` option removed in Hyprland 0.55+; pseudotiling is the `pseudo` dispatcher (Super+P)
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# ---------------------------------------------------------------------------
# Input
# ---------------------------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        disable_while_typing = true
    }
}

# Touchpad gestures: new keyword syntax since Hyprland 0.51 (replaces the `gestures {}` block)
gesture = 3, horizontal, workspace

# ---------------------------------------------------------------------------
# Keybindings  ($mainMod = SUPER)
# ---------------------------------------------------------------------------
$mainMod = SUPER

# Core
bind = $mainMod, Return, exec, uwsm app -- $terminal
bind = $mainMod, Q, killactive
bind = $mainMod, E, exec, uwsm app -- $fileManager
bind = $mainMod, Space, exec, $menu
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod, P, pseudo
bind = $mainMod, J, layoutmsg, togglesplit

# macOS-like copy/paste: ALT+C / ALT+V -> Ctrl+Insert / Shift+Insert.
# Uses sendkeystate, NOT sendshortcut: sendshortcut is broken in Hyprland 0.55
# (the keybind fires but the synthetic shortcut never reaches the window).
# Press sends key-down, release sends key-up so no modifier gets stuck.
bind  = ALT, C, sendkeystate, CTRL,  INSERT, down, activewindow
bindr = ALT, C, sendkeystate, CTRL,  INSERT, up,   activewindow
bind  = ALT, V, sendkeystate, SHIFT, INSERT, down, activewindow
bindr = ALT, V, sendkeystate, SHIFT, INSERT, up,   activewindow

# Noctalia surfaces
bind = $mainMod, B, exec, qs -c noctalia-shell ipc call controlCenter toggle
bind = $mainMod, N, exec, qs -c noctalia-shell ipc call launcher clipboard
bind = $mainMod, Escape, exec, qs -c noctalia-shell ipc call sessionMenu toggle
bind = $mainMod, L, exec, qs -c noctalia-shell ipc call lockScreen lock
bind = $mainMod SHIFT, W, exec, qs -c noctalia-shell ipc call wallpaper random ""

# Screenshots (hyprshot) — save to disk + clipboard
# Print variants kept for external keyboards; this laptop has no Print key, use the Super ones.
bind = , Print, exec, hyprshot -m region -o $HOME/Pictures/Screenshots
bind = SHIFT, Print, exec, hyprshot -m window -o $HOME/Pictures/Screenshots
bind = CTRL, Print, exec, hyprshot -m output -o $HOME/Pictures/Screenshots
bind = $mainMod, S, exec, hyprshot -m region -o $HOME/Pictures/Screenshots
bind = $mainMod ALT, S, exec, hyprshot -m window -o $HOME/Pictures/Screenshots
bind = $mainMod CTRL, S, exec, hyprshot -m output -o $HOME/Pictures/Screenshots

# Screenshots to clipboard only (for pasting into Claude/chat; no file left behind)
# -z freezes the screen (via hyprpicker) so hover states and open menus can be captured
bind = $mainMod SHIFT, S, exec, hyprshot -m region -z -s --clipboard-only
bind = $mainMod SHIFT, Print, exec, hyprshot -m window -z -s --clipboard-only
bind = $mainMod SHIFT ALT, S, exec, hyprshot -m window -z -s --clipboard-only

# Focus movement (arrow keys; SUPER+L is reserved for lock above)
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Workspaces 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to workspace 1-10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Mouse: drag to move/resize floating windows
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media & brightness keys — routed through Noctalia IPC so its OSD shows.
bindel = , XF86AudioRaiseVolume,  exec, qs -c noctalia-shell ipc call volume increase
bindel = , XF86AudioLowerVolume,  exec, qs -c noctalia-shell ipc call volume decrease
bindl  = , XF86AudioMute,         exec, qs -c noctalia-shell ipc call volume muteOutput
bindel = , XF86MonBrightnessUp,   exec, qs -c noctalia-shell ipc call brightness increase
bindel = , XF86MonBrightnessDown, exec, qs -c noctalia-shell ipc call brightness decrease
bindl  = , XF86AudioPlay,  exec, qs -c noctalia-shell ipc call media playPause
bindl  = , XF86AudioNext,  exec, qs -c noctalia-shell ipc call media next
bindl  = , XF86AudioPrev,  exec, qs -c noctalia-shell ipc call media previous

# ---------------------------------------------------------------------------
# Window rules
# ---------------------------------------------------------------------------
# Window rules use match-first syntax (Hyprland 0.53+): match criteria first, then the action.
# NOTE: the old `suppressevent maximize` rule was removed/renamed in this version — parked until the
# replacement field name is confirmed against the installed Hyprland's docs.
# windowrule = match:class .*, suppressevent maximize
windowrule = match:class thunar match:title File Operation Progress, float on

# ---------------------------------------------------------------------------
# Theming — Noctalia App Theming generates this palette file and keeps it in
# sync with the active color scheme. We track only this `source` line (it never
# changes per scheme); the colors themselves live in the generated file and are
# intentionally NOT tracked by chezmoi.
# ---------------------------------------------------------------------------
source = ~/.config/hypr/noctalia/noctalia-colors.conf
