# hypridle — managed by chezmoi (Linux only).
# Idle escalation: lock (Noctalia) -> screen off -> suspend.
# Reference: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    # How to lock. Noctalia provides the lock surface via its IPC CLI.
    lock_cmd = noctalia msg session lock
    # Lock before the system sleeps...
    before_sleep_cmd = noctalia msg session lock
    # ...and turn the display back on when we wake.
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 5 min: lock the session
listener {
    timeout = 300
    on-timeout = noctalia msg session lock
}

# 5.5 min: turn off the display (on, restored on activity)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 15 min: suspend
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
