# Noctalia v5 — managed by chezmoi (Linux only).
# Hand-written config; only keys that differ from the defaults live here.
# Full reference: https://docs.noctalia.dev/noctalia/configuration/
# Defaults:       noctalia config export full
#
# Settings changed in the GUI go to ~/.local/state/noctalia/settings.toml
# (untracked, per-machine). Fold anything worth keeping back into this file.

[shell]
telemetry_enabled = false
# polkit auth popups come from hyprpolkitagent (systemd user service), so
# Noctalia's own agent stays off (the default) to avoid two agents racing.
polkit_agent      = false

# ── Theme ──────────────────────────────────────────────────────────────────
# Noctalia is the single source of truth for COLORS: the templates below render
# per-app palette files on every palette change. chezmoi tracks STRUCTURE only
# (ghostty: `theme = noctalia`; hyprland: require("noctalia")); never duplicate
# colors in tracked configs.
[theme]
mode    = "dark"
source  = "builtin"
builtin = "Rosé Pine"

[theme.templates]
enable_builtin_templates   = true
builtin_ids                = ["hyprland", "ghostty", "starship", "btop", "qt"]
# Community templates are fetched from api.noctalia.dev and cached locally.
# vscode: renders the theme JSON inside the Marketplace extension
# `noctalia.noctaliatheme` (install it once: code --install-extension
# noctalia.noctaliatheme) and set "workbench.colorTheme": "NoctaliaTheme".
enable_community_templates = true
community_ids              = ["vscode"]

# Push the palette into every open terminal via OSC sequences (instant recolour
# of running shells/TUIs; Ghostty also reloads on its own).
[theme.templates.user.terminal-osc]
input_path  = "templates/terminal-osc.env"
output_path = "~/.cache/noctalia/terminal-osc.env"
post_hook   = "~/.local/bin/noctalia-osc-recolor"

# Neovim palette for aether.nvim (see nvim/lua/plugins/colorscheme.lua);
# SIGUSR1 makes running instances re-read it.
[theme.templates.user.neovim-colors]
input_path  = "templates/neovim-colors.lua"
output_path = "~/.config/nvim/lua/noctalia_colors.lua"
post_hook   = "pkill -SIGUSR1 -x nvim || true"

# ── Wallpaper ──────────────────────────────────────────────────────────────
[wallpaper]
directory = "~/Pictures/Wallpapers"

# ── Idle ───────────────────────────────────────────────────────────────────
# Idle/lock/dpms/suspend escalation is owned by hypridle (~/.config/hypr/hypridle.conf),
# which calls `noctalia msg session lock`. Keep Noctalia's own idle actions off.
[idle.behavior.lock]
enabled = false

[idle.behavior.screen-off]
enabled = false
