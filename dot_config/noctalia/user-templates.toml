[config]

[templates]

# User-defined templates — processed by Noctalia App Theming when
# "Enable user theming" is on. Same placeholder syntax as built-in templates.

# Hyprland Lua palette (replaces the built-in hyprlang `hyprland` template
# for the 0.55+ Lua config; see ~/.config/hypr/hyprland.lua).
[templates.hyprland-lua]
input_path = "~/.config/noctalia/templates/hyprland.lua"
output_path = "~/.config/hypr/noctalia/noctalia-colors.lua"
post_hook = "hyprctl reload"
