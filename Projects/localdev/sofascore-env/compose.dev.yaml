name: sofascore_dev_tools

# Local "tools" container: PHP 8.5 + extensions + Composer.
# Runs composer / phpstan / php-cs-fixer / paratest / bin/console locally,
# while the browser-facing app keeps running on the remote dev server.
#
#  - network_mode: host  -> reaches the test services (postgres 5555, redis 6380,
#    es 9201, beanstalk 11301) at the localhost ports the repo's .env.test expects.
#  - same-path bind mount -> container path == host path, so paths line up in
#    error output, quickfix, and any config that references absolute paths.
#  - commands are exec'd as your UID (see bin/ shims and the Makefile), so files
#    written by composer/console (vendor/, var/) are owned by you, not root.
#  - PHP version, extensions and PHP ini come from the project repo itself
#    (Dockerfile + docker/base/install.sh via the Makefile, and the mounted
#    docker/base/php/99-sofa.ini), so this container tracks prod instead of drifting.

services:
  tools:
    container_name: sofascore_tools
    build:
      # Tiny context (this dir) — the Dockerfile COPYs nothing; the repo is
      # bind-mounted at runtime, not baked into the image.
      context: .
      # All set by `make build`/`make up`, parsed from the project repo itself
      # (Dockerfile + docker/base/install.sh), so the image follows the repo.
      # Build only through the Makefile; the shims never build.
      args:
        PHP_VERSION: ${PHP_VERSION:-}
        PHP_DEBIAN: ${PHP_DEBIAN:-}
        PHP_EXTENSION_INSTALLER_VERSION: ${PHP_EXTENSION_INSTALLER_VERSION:-}
        PHP_EXTENSIONS: ${PHP_EXTENSIONS:-}
        IMAGEMAGICK_DEB_URL: ${IMAGEMAGICK_DEB_URL:-}
        WKHTMLTOX_DEB_URL: ${WKHTMLTOX_DEB_URL:-}
      # Mirrors docker/base/install.sh minus the server bits (nginx, runit,
      # php-fpm config, New Relic): same extensions, imagick built by pecl
      # against the project's ImageMagick 7 package, wkhtmltopdf, pngquant.
      dockerfile_inline: |
        ARG PHP_VERSION=missing
        ARG PHP_DEBIAN=bookworm
        FROM php:$${PHP_VERSION}-cli-$${PHP_DEBIAN}
        ARG PHP_EXTENSION_INSTALLER_VERSION
        ARG PHP_EXTENSIONS
        ARG IMAGEMAGICK_DEB_URL
        ARG WKHTMLTOX_DEB_URL
        RUN set -eux; \
            : "$${PHP_EXTENSION_INSTALLER_VERSION:?build with make up}" \
              "$${PHP_EXTENSIONS:?build with make up}" \
              "$${IMAGEMAGICK_DEB_URL:?build with make up}" \
              "$${WKHTMLTOX_DEB_URL:?build with make up}"; \
            curl -sSLfo /usr/local/bin/install-php-extensions \
              "https://github.com/mlocati/docker-php-extension-installer/releases/download/$${PHP_EXTENSION_INSTALLER_VERSION}/install-php-extensions"; \
            chmod +x /usr/local/bin/install-php-extensions; \
            install-php-extensions $${PHP_EXTENSIONS}; \
            apt-get update; \
            apt-get install -y --no-install-recommends git unzip pngquant $${PHPIZE_DEPS}; \
            curl -sSLfo /tmp/imagemagick.deb "$${IMAGEMAGICK_DEB_URL}"; \
            apt-get install -y --no-install-recommends /tmp/imagemagick.deb; \
            pecl install imagick; \
            docker-php-ext-enable imagick; \
            curl -sSLfo /tmp/wkhtmltox.deb "$${WKHTMLTOX_DEB_URL}"; \
            apt-get install -y --no-install-recommends /tmp/wkhtmltox.deb; \
            apt-get purge -y --auto-remove $${PHPIZE_DEPS} $$(apt-mark showmanual | grep '\-dev$$' || true); \
            rm -rf /var/lib/apt/lists/* /tmp/*.deb /tmp/pear
        ENV HOME=/tmp \
            COMPOSER_HOME=/tmp/.composer \
            COMPOSER_ALLOW_SUPERUSER=1
    working_dir: ${SOFASCORE_REPO}
    network_mode: host
    volumes:
      - ${SOFASCORE_REPO}:${SOFASCORE_REPO}
      # The project's own PHP settings (apc.enable_cli, date.timezone=UTC,
      # memory_limit, opcache…), then local CLI overrides on top.
      - ${SOFASCORE_REPO}/docker/base/php/99-sofa.ini:/usr/local/etc/php/conf.d/99-sofa.ini:ro
      - ./php.ini:/usr/local/etc/php/conf.d/zz-local.ini:ro
    command: ["sleep", "infinity"]
    # Come back after reboots (docker.service is enabled). The bin/ shims also
    # start it on next use (without building), so `make up` is only needed
    # after changing the image.
    restart: unless-stopped
